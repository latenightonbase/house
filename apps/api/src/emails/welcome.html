<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to LNOC</title>
</head>
<body style="margin:0;padding:0;background:#070a12;font-family:Inter,Helvetica,Arial,sans-serif;color:#e8edf7;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#070a12;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;background:#0d1220;border:1px solid #1c2438;border-radius:16px;overflow:hidden;">
          <tr>
            <td style="padding:28px 32px 8px;letter-spacing:0.2em;font-size:13px;font-weight:800;color:#ffffff;">LNOC</td>
          </tr>
          <tr>
            <td style="padding:8px 32px 0;font-size:24px;font-weight:700;color:#ffffff;">Welcome{{#username}}, @{{username}}{{/username}}</td>
          </tr>
          <tr>
            <td style="padding:16px 32px 28px;font-size:15px;line-height:1.6;color:#9aa4b8;">
              Your profile is ready. Browse Discover to bid on the daily auction or buy a listing. We’ll email you if you win or get outbid.
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 32px;">
              <a href="{{appUrl}}" style="display:inline-block;background:#5b6cff;color:#ffffff;text-decoration:none;font-weight:600;font-size:14px;padding:12px 18px;border-radius:10px;">Open Discover</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
