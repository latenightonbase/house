<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verify your email</title>
</head>
<body style="margin:0;padding:0;background:#070a12;font-family:Inter,Helvetica,Arial,sans-serif;color:#e8edf7;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#070a12;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;background:#0d1220;border:1px solid #1c2438;border-radius:16px;">
          <tr>
            <td style="padding:28px 32px 8px;letter-spacing:0.2em;font-size:13px;font-weight:800;color:#ffffff;">LNOC</td>
          </tr>
          <tr>
            <td style="padding:8px 32px 0;font-size:24px;font-weight:700;color:#ffffff;">Verify your email</td>
          </tr>
          <tr>
            <td style="padding:16px 32px 8px;font-size:15px;line-height:1.6;color:#9aa4b8;">
              Enter this code to confirm <strong style="color:#e8edf7;">{{email}}</strong>. It expires in 10 minutes.
            </td>
          </tr>
          <tr>
            <td style="padding:12px 32px 32px;">
              <div style="display:inline-block;background:#151b2c;border:1px solid #2a3550;border-radius:12px;padding:14px 22px;font-size:28px;letter-spacing:0.28em;font-weight:700;color:#ffffff;">{{code}}</div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
