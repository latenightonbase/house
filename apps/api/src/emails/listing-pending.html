<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A listing needs review</title>
</head>
<body style="margin:0;padding:0;background:#070a12;font-family:Inter,Helvetica,Arial,sans-serif;color:#e8edf7;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#070a12;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;background:#0d1220;border:1px solid #1c2438;border-radius:16px;">
          <tr>
            <td style="padding:28px 32px 8px;letter-spacing:0.2em;font-size:13px;font-weight:800;color:#ffffff;">LNOC</td>
          </tr>
          <tr>
            <td style="padding:8px 32px 0;font-size:24px;font-weight:700;color:#ffffff;">A listing needs review</td>
          </tr>
          <tr>
            <td style="padding:16px 32px 8px;font-size:15px;line-height:1.6;color:#9aa4b8;">
              <strong style="color:#e8edf7;">{{seller}}</strong> submitted <strong style="color:#e8edf7;">{{title}}</strong> for approval. It is not visible on the marketplace until you approve it.
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 8px;font-size:14px;line-height:1.7;color:#9aa4b8;">
              {{category}} &middot; {{pricing}} &middot; <strong style="color:#e8edf7;">${{price}}</strong>
            </td>
          </tr>
          {{#description}}
          <tr>
            <td style="padding:8px 32px;font-size:14px;line-height:1.6;color:#9aa4b8;border-left:2px solid #1c2438;">
              {{description}}
            </td>
          </tr>
          {{/description}}
          <tr>
            <td style="padding:16px 32px 32px;">
              <a href="{{reviewUrl}}" style="display:inline-block;background:#5b6cff;color:#ffffff;text-decoration:none;font-weight:600;font-size:14px;padding:12px 18px;border-radius:10px;">Review it</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
