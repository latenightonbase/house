[profile.default]
src = "."
out = "out"
libs = ["lib"]
solc = "0.8.22"
optimizer = true
optimizer_runs = 200
via_ir = false
skip = [
    "lib/openzeppelin-contracts/certora/**",
    "lib/openzeppelin-contracts/test/**",
    "lib/openzeppelin-contracts/scripts/**",
    "lib/openzeppelin-contracts/contracts/mocks/**",
    "lib/openzeppelin-contracts/contracts/governance/**",
    "lib/openzeppelin-contracts/contracts/account/**",
]

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"

[fmt]
bracket_spacing = true
line_length = 100
